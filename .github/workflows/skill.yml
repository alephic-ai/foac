name: Skill

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: skill-${{ github.ref }}
  # Cancel superseded runs on PR branches only: every merge to master should
  # get a completed run, and rapid merges can race-cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: skref validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The spec wants the directory named after the skill, which only applies
      # once installed; stage the source file accordingly before validating.
      - run: |
          mkdir -p "$RUNNER_TEMP/skills/foac"
          cp doc/SKILL.md "$RUNNER_TEMP/skills/foac/"
      - uses: alephic-ai/skref@v1
        with:
          path: ${{ runner.temp }}/skills
