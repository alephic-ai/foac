name: Skill

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: skill-${{ github.ref }}
  # Cancel superseded runs on PR branches only: every merge to master should
  # get a completed run, and rapid merges can race-cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: skref validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The installed skills are rendered artifacts, one per provider; render
      # each the way `foac skill install` would and validate those.
      - run: |
          cargo build --locked
          for p in figma github linear sentry slack; do
            mkdir -p "$RUNNER_TEMP/skills/foac-$p"
            ./target/debug/foac skill print "$p" > "$RUNNER_TEMP/skills/foac-$p/SKILL.md"
          done
      - uses: alephic-ai/skref@v1
        with:
          path: ${{ runner.temp }}/skills
