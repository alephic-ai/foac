name: Markdown

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: markdown-${{ github.ref }}
  # Cancel superseded runs on PR branches only: every merge to master should
  # get a completed run, and rapid merges can race-cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: rumdl check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rvben/rumdl@v0
