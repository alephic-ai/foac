name: Release

on:
  push:
    branches: [main]
    # Only changes to the binary's code or compiled-in assets warrant a
    # release; docs and workflow edits ride along with the next real one.
    paths:
      - "src/**"
      - "assets/**"
      - Cargo.toml
      - Cargo.lock
  # Escape hatch: run by hand, e.g. to resume after a workflow fix.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      should_release: ${{ steps.plan.outputs.should_release }}
    permissions:
      contents: write
    steps:
      # Push to main as alephic-bot: the org ruleset only lets that app push
      # to the default branch directly, github.token gets rejected.
      - name: Generate Alephic Bot token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.ALEPHIC_BOT_APP_ID }}
          private-key: ${{ secrets.ALEPHIC_BOT_SECRET }}
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Work from the current tip of main, not the trigger commit, so a
          # run queued behind another one sees the bump the first run pushed.
          git fetch origin main
          git checkout -B main origin/main
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "Could not read version from Cargo.toml" >&2
            exit 1
          fi
          tag="v${version}"
          # A draft counts as unreleased: it is left behind when a previous
          # run failed before publishing, and the release path resumes it.
          published=$(gh release view "$tag" --json isDraft --jq 'if .isDraft then "no" else "yes" end' 2>/dev/null || echo "no")
          if [ "$published" = "no" ]; then
            # Version was bumped (by hand or below) but never released.
            echo "No published release for ${tag}"
            sha=$(git rev-parse HEAD)
            # Releases are immutable: the tag must exist before the draft
            # release is created, so assets can be attached pre-publish.
            if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              git tag "$tag" "$sha"
              git push origin "refs/tags/${tag}"
            fi
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "sha=${sha}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git rev-list "${tag}..HEAD" --count)" -eq 0 ]; then
            echo "Release ${tag} already exists and nothing new since"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # New commits on a released version: bump from conventional-commit
          # prefixes (feat! -> major, feat -> minor, anything else -> patch),
          # commit the bump to main, and release it in this same run.
          subjects=$(git log "${tag}..HEAD" --format=%s)
          IFS=. read -r major minor patch <<<"$version"
          if grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' <<<"$subjects"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$subjects"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          new="${major}.${minor}.${patch}"
          sed -i "s/^version = \"${version}\"/version = \"${new}\"/" Cargo.toml
          cargo update --package foac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${new}"
          # Unlike github.token, an app-token push re-triggers this workflow;
          # the queued run no-ops above ("nothing new since" once published,
          # or resumes the draft if this run died before publishing).
          git push origin main
          echo "Bumped ${version} -> ${new}"
          sha=$(git rev-parse HEAD)
          git tag "v${new}" "$sha"
          git push origin "refs/tags/v${new}"
          echo "tag=v${new}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create release
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        # Draft first: releases are immutable once published, so assets must
        # be uploaded before the publish step below. Reuses a leftover draft.
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --generate-notes --draft

  upload-assets:
    name: ${{ matrix.target }}
    needs: [prepare, create-release]
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Build from the release tag, not the trigger commit: the version
          # bump only exists on the tag when Prepare created it in this run.
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: foac
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          checksum: sha256
          include: LICENSE,README.md
          locked: true
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

  publish-release:
    name: Publish release
    needs: [prepare, upload-assets]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false

  crates-io:
    name: Publish to crates.io
    needs: [prepare, publish-release]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Trusted Publishing: crates.io trades this workflow's OIDC identity for
      # a short-lived token, so there is no registry secret to store or rotate.
      id-token: write
      # A job-level block replaces the top-level grant, so checkout needs this.
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The version bump only exists on the tag when Prepare made it.
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # crates.io versions are immutable, so a re-run of an already-published
      # version is expected to fail here; nothing downstream depends on it.
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  homebrew:
    name: Update Homebrew tap
    needs: [prepare, publish-release]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      # The bot is a bypass actor on the org rulesets that gate every default
      # branch; github.token would be rejected pushing to the tap's main.
      - name: Generate Alephic Bot token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.ALEPHIC_BOT_APP_ID }}
          private-key: ${{ secrets.ALEPHIC_BOT_SECRET }}
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          repository: alephic-ai/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
      # The formula is generated, never hand-edited: the release tarballs and
      # their .sha256 sidecars are all a binary formula needs. Fix a bad one
      # here, not in the tap.
      - env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          base="https://github.com/alephic-ai/foac/releases/download/${TAG}"
          sha() { curl -fsSL "${base}/foac-$1.sha256" | cut -d' ' -f1; }
          mkdir -p Formula
          # `brew style` rejects a desc opening with an article or with the
          # formula name, so this is not the repo's own description.
          cat > Formula/foac.rb <<EOF
          class Foac < Formula
            desc "Father Of All CLIs, one CLI for every service your agents touch"
            homepage "https://github.com/alephic-ai/foac"
            version "${TAG#v}"
            license "GPL-3.0-or-later"

            on_macos do
              on_arm do
                url "${base}/foac-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "${base}/foac-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "${base}/foac-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "${base}/foac-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "foac"
            end

            def caveats
              "Use 'brew upgrade foac', not 'foac update': the next brew upgrade overwrites a self-replaced binary."
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/foac version")
            end
          end
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/foac.rb
          git diff --quiet --cached || git commit -m "foac ${TAG#v}"
          # Another tool releasing at once pushes here too; concurrency groups
          # are per-repo, so the loser rebases instead of failing the release.
          git push || { git pull --rebase && git push; }
