name: Release

on:
  push:
    branches: [main]
    # Only changes to the binary's code or compiled-in assets warrant a
    # release; docs and workflow edits ride along with the next real one.
    paths:
      - "src/**"
      - "graphql/**"
      - "doc/SKILL.md"
      - Cargo.toml
      - Cargo.lock
  # Escape hatch: run by hand, e.g. to resume after a workflow fix.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      should_release: ${{ steps.plan.outputs.should_release }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Work from the current tip of main, not the trigger commit, so a
          # run queued behind another one sees the bump the first run pushed.
          git fetch origin main
          git checkout -B main origin/main
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "Could not read version from Cargo.toml" >&2
            exit 1
          fi
          tag="v${version}"
          # A draft counts as unreleased: it is left behind when a previous
          # run failed before publishing, and the release path resumes it.
          published=$(gh release view "$tag" --json isDraft --jq 'if .isDraft then "no" else "yes" end' 2>/dev/null || echo "no")
          if [ "$published" = "no" ]; then
            # Version was bumped (by hand or below) but never released.
            echo "No published release for ${tag}"
            sha=$(git rev-parse HEAD)
            # Releases are immutable: the tag must exist before the draft
            # release is created, so assets can be attached pre-publish.
            if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              git tag "$tag" "$sha"
              git push origin "refs/tags/${tag}"
            fi
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "sha=${sha}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git rev-list "${tag}..HEAD" --count)" -eq 0 ]; then
            echo "Release ${tag} already exists and nothing new since"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # New commits on a released version: bump from conventional-commit
          # prefixes (feat! -> major, feat -> minor, anything else -> patch),
          # commit the bump to main, and release it in this same run.
          subjects=$(git log "${tag}..HEAD" --format=%s)
          IFS=. read -r major minor patch <<<"$version"
          if grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' <<<"$subjects"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$subjects"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          new="${major}.${minor}.${patch}"
          sed -i "s/^version = \"${version}\"/version = \"${new}\"/" Cargo.toml
          cargo update --package foac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${new}"
          git push origin main
          echo "Bumped ${version} -> ${new}"
          sha=$(git rev-parse HEAD)
          git tag "v${new}" "$sha"
          git push origin "refs/tags/v${new}"
          echo "tag=v${new}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create release
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        # Draft first: releases are immutable once published, so assets must
        # be uploaded before the publish step below. Reuses a leftover draft.
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --generate-notes --draft

  upload-assets:
    name: ${{ matrix.target }}
    needs: [prepare, create-release]
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Build from the release tag, not the trigger commit: the version
          # bump only exists on the tag when Prepare created it in this run.
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: foac
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          checksum: sha256
          include: LICENSE,README.md
          locked: true
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

  publish-release:
    name: Publish release
    needs: [prepare, upload-assets]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
