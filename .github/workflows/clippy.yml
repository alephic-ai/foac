name: Clippy

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: clippy-${{ github.ref }}
  # Cancel superseded runs on PR branches only: every merge to master should
  # get a completed run, and rapid merges can race-cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
