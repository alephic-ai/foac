name: EditorConfig

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: editorconfig-${{ github.ref }}
  # Cancel superseded runs on PR branches only: every merge to master should
  # get a completed run, and rapid merges can race-cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check EditorConfig compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@v2.2.0
      - name: Check files
        run: editorconfig-checker -format github-actions
