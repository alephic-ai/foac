[package]
name = "foac"
version = "0.2.0"
edition = "2024"
description = "foac, the Father Of All CLIs"
license = "GPL-3.0-or-later"
authors = ["Laurent Raufaste <analogue@glop.org>"]
repository = "https://github.com/lra/foac"
