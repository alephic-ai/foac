[package]
name = "foac"
version = "0.3.0"
edition = "2024"
description = "foac, the Father Of All CLIs"
license = "GPL-3.0-or-later"
authors = ["Laurent Raufaste <analogue@glop.org>"]
repository = "https://github.com/lra/foac"
readme = "README.md"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
graphql_client = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
self_update = { version = "1.0.0-rc.6", features = ["archive-zip", "compression-zip-deflate", "checksums"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
