fragment PageFields on PageInfo {
  hasNextPage
  endCursor
}

fragment IssueFields on Issue {
  id
  identifier
  title
  url
  priority
  estimate
  dueDate
  createdAt
  updatedAt
  state {
    id
    name
    type
  }
  assignee {
    id
    displayName
  }
  team {
    id
    key
  }
  project {
    id
    name
  }
  labels {
    nodes {
      id
      name
    }
  }
}

fragment ProjectFields on Project {
  id
  name
  description
  url
  startDate
  targetDate
  priority
  status {
    id
    name
    type
  }
  lead {
    id
    displayName
  }
  teams {
    nodes {
      id
      key
    }
  }
  createdAt
  updatedAt
}

fragment CommentFields on Comment {
  id
  body
  url
  createdAt
  updatedAt
  user {
    id
    displayName
  }
}

fragment MilestoneFields on ProjectMilestone {
  id
  name
  description
  targetDate
  project {
    id
    name
  }
}

fragment DocumentFields on Document {
  id
  title
  url
  createdAt
  updatedAt
  project {
    id
    name
  }
  initiative {
    id
    name
  }
  creator {
    id
    displayName
  }
}

fragment InitiativeFields on Initiative {
  id
  name
  description
  targetDate
  url
  status
  owner {
    id
    displayName
  }
  createdAt
  updatedAt
}

fragment StateFields on WorkflowState {
  id
  name
  type
  position
  color
  team {
    id
    key
  }
}

fragment LabelFields on IssueLabel {
  id
  name
  color
  description
  isGroup
  team {
    id
    key
  }
  parent {
    id
    name
  }
}

fragment ProjectUpdateFields on ProjectUpdate {
  id
  body
  health
  url
  createdAt
  user {
    id
    displayName
  }
  project {
    id
    name
  }
}

fragment InitiativeUpdateFields on InitiativeUpdate {
  id
  body
  health
  url
  createdAt
  user {
    id
    displayName
  }
  initiative {
    id
    name
  }
}

fragment AttachmentFields on Attachment {
  id
  title
  subtitle
  url
  createdAt
  issue {
    id
    identifier
  }
}

query WorkspaceGet {
  organization {
    id
    name
    urlKey
    createdAt
  }
  viewer {
    id
    name
    displayName
    email
  }
}

query IssueList($first: Int, $after: String, $filter: IssueFilter) {
  issues(first: $first, after: $after, filter: $filter) {
    nodes {
      ...IssueFields
    }
    pageInfo {
      ...PageFields
    }
  }
}

query IssueGet($id: String!) {
  issue(id: $id) {
    ...IssueFields
    description
    parent {
      id
      identifier
    }
    cycle {
      id
      name
      number
    }
    creator {
      id
      displayName
    }
  }
}

mutation IssueCreate($input: IssueCreateInput!) {
  issueCreate(input: $input) {
    success
    issue {
      ...IssueFields
    }
  }
}

mutation IssueUpdate($id: String!, $input: IssueUpdateInput!) {
  issueUpdate(id: $id, input: $input) {
    success
    issue {
      ...IssueFields
    }
  }
}

query CommentList($issueId: String!, $first: Int, $after: String) {
  issue(id: $issueId) {
    id
    identifier
    comments(first: $first, after: $after) {
      nodes {
        ...CommentFields
      }
      pageInfo {
        ...PageFields
      }
    }
  }
}

mutation CommentCreate($input: CommentCreateInput!) {
  commentCreate(input: $input) {
    success
    comment {
      ...CommentFields
    }
  }
}

mutation CommentUpdate($id: String!, $input: CommentUpdateInput!) {
  commentUpdate(id: $id, input: $input) {
    success
    comment {
      ...CommentFields
    }
  }
}

mutation CommentDelete($id: String!) {
  commentDelete(id: $id) {
    success
  }
}

